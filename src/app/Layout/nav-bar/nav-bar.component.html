<input type="checkbox" id="sidebarToggle" class="sidebar-checkbox" #sidebarToggle>

<!-- Mobile/Tablet Backdrop -->
<label for="sidebarToggle" class="sidebar-backdrop" (click)="sidebarToggle.checked = false"></label>

<!-- Mobile/Tablet Hamburger Toggle Button -->
<label for="sidebarToggle" class="sidebar-toggle" title="Toggle Navigation Menu">
  <i class="fa-solid fa-bars"></i>
</label>

<div class="sidebar-inner">
  <div class="sidebar-brand">
    <div class="brand-logo">
      <i class="fa-solid fa-briefcase"></i>
    </div>

    <div class="brand-info">
      <span class="brand-name">HR Portal</span>
      <span class="brand-subtitle">Management System</span>
    </div>

    <!-- Close button inside drawer for mobile/tablet -->
    <label for="sidebarToggle" class="sidebar-close-btn" (click)="sidebarToggle.checked = false" title="Close Menu">
      <i class="fa-solid fa-xmark"></i>
    </label>
  </div>

  <div class="sidebar-nav-section">
    <ul class="sidebar-menu">
      <li>
        <a class="sidebar-link" routerLink="/dashboard" routerLinkActive="active-link" (click)="sidebarToggle.checked = false">
          <i class="fa-solid fa-chart-pie menu-icon"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a class="sidebar-link" routerLink="/employees" routerLinkActive="active-link" (click)="sidebarToggle.checked = false">
          <i class="fa-solid fa-users menu-icon"></i>
          <span>Employees</span>
        </a>
      </li>
      <li>
        <a class="sidebar-link" routerLink="/departments" routerLinkActive="active-link" (click)="sidebarToggle.checked = false">
          <i class="fa-solid fa-sitemap menu-icon"></i>
          <span>Departments</span>
        </a>
      </li>
      <li>
        <a class="sidebar-link" routerLink="/attendance" routerLinkActive="active-link" (click)="sidebarToggle.checked = false">
          <i class="fa-solid fa-calendar-check menu-icon"></i>
          <span>Attendance</span>
        </a>
      </li>
      <li>
        <a class="sidebar-link" routerLink="/leaves" routerLinkActive="active-link" (click)="sidebarToggle.checked = false">
          <i class="fa-solid fa-envelope-open-text menu-icon"></i>
          <span>Leaves</span>
        </a>
      </li>
      <li>
        <a class="sidebar-link" routerLink="/user-profile" routerLinkActive="active-link" (click)="sidebarToggle.checked = false">
          <i class="fa-solid fa-user-tie menu-icon"></i>
          <span>User Profile</span>
        </a>
      </li>
      <li>
        <a class="sidebar-link" routerLink="/settings" routerLinkActive="active-link" (click)="sidebarToggle.checked = false">
          <i class="fa-solid fa-sliders menu-icon"></i>
          <span>Settings</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="sidebar-footer">
    <button class="btn-logout" (click)="LogOutUser(); sidebarToggle.checked = false">
      <i class="fa-solid fa-right-from-bracket logout-icon"></i>
      <span>Log Out</span>
    </button>
  </div>
</div>

<!-- Beautiful Logout Modal Overlay -->
<div class="custom-modal-overlay animate-fade-in" *ngIf="openpopu">
  <div class="custom-modal-panel shadow-lg animate-scale-up">
    <div class="modal-alert-icon text-danger">
      <i class="fa-solid fa-circle-exclamation"></i>
    </div>
    <h3 class="modal-title mt-3 text-center">Confirm Logout</h3>
    <p class="modal-text text-center mt-2 mb-4">
      Are you sure you want to logout from the application? Your active session will be ended.
    </p>
    <div class="d-flex justify-content-center gap-3 w-100">
      <button class="btn btn-secondary flex-grow-1" (click)="CencleLogout()">
        Cancel
      </button>
      <button class="btn btn-danger flex-grow-1" (click)="conformLogout()">
        Yes, Logout
      </button>
    </div>
  </div>
</div>
